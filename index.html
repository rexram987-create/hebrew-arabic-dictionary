<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מנוע המילון העברי–ערבי</title><style>body{font-family:system-ui,sans-serif;max-width:750px;margin:auto;padding:24px;background:#101b22;color:#f4f8f8}input,button{font:inherit;padding:12px;border-radius:10px}input{width:65%;box-sizing:border-box}button{cursor:pointer;background:#16a085;color:white;border:0}article{background:#1b3036;margin-top:12px;padding:14px;border-radius:12px}.muted{color:#bcd1d0}h2{font-size:1.4em}</style></head><body><h1>מנוע המילון העברי–ערבי</h1><p class="muted">אב־טיפוס לבדיקת API. ארבע דוגמאות ידניות בלבד; מאגרי Kaikki ו־Curras טרם יובאו.</p><form id="f"><input id="q" placeholder="חיפוש בעברית או בערבית" aria-label="מילה לחיפוש" required><button>חפש</button></form><div id="out" aria-live="polite"></div><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const o=document.getElementById('out');o.textContent='מחפש…';try{const r=await fetch('/api/search?q='+encodeURIComponent(document.getElementById('q').value));const d=await r.json();o.replaceChildren();if(!r.ok){o.textContent=d.error;return}if(!d.results.length){o.textContent='לא נמצאו תוצאות במדגם הקטן';return}for(const item of d.results){const a=document.createElement('article');const h=document.createElement('h2');h.textContent=item.hebrew;a.append(h);for(const [label,key] of [['ספרותית','msa'],['פלסטינית','palestinian']]){const p=document.createElement('p');p.textContent=label+': '+item.arabic[key].text+' — '+item.arabic[key].transliteration_he;a.append(p)}o.append(a)}}catch(err){o.textContent='שגיאת רשת: '+err.message}}</script></body></html>
